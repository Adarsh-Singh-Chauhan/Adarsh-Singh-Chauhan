 <rect x="12" y="12" width="366" height="30" rx="6" fill="#19132a"/><circle cx="28" cy="27" r="4" fill="#fb7185"/><circle cx="42" cy="27" r="4" fill="#fbbf24"/><circle cx="56" cy="27" r="4" fill="#34d399"/><text x="74" y="31" class="m" font-size="10" fill="#c4b5fd">dashboard / telemetry</text>
 <g transform="translate(22 70)"><path d="M0 140H346M0 104H346M0 68H346M0 32H346" stroke="#33445e"/><path d="M0 135L40 110L83 116L124 62L164 82L205 40L245 56L292 19L346 31V140H0Z" fill="#22d3ee" opacity=".09"/><path d="M0 135L40 110L83 116L124 62L164 82L205 40L245 56L292 19L346 31" stroke="url(#c)" stroke-width="4" fill="none" class="dash"/><circle cx="292" cy="19" r="7" fill="#f472b6" class="pulse"/></g><text x="22" y="229" class="m" font-size="10" fill="#9fb5ce">API / AI PIPELINE / SYSTEM STATUS</text>
</g>
