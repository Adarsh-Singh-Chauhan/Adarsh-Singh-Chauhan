<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="t d">
<title id="t">Adarsh's Vibe Coding Lab</title><desc id="d">A neon cyberpunk illustration of a developer seen from behind coding at multiple monitors, with terminal windows, a glowing desk and animated telemetry.</desc>
<defs>
 <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040711"/><stop offset=".52" stop-color="#111027"/><stop offset="1" stop-color="#06192c"/></linearGradient>
 <linearGradient id="p"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
 <linearGradient id="c"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
 <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#718ba8" stroke-opacity=".12" fill="none"/></pattern>
 <filter id="gl"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.u{font-family:Arial,Helvetica,sans-serif}.m{font-family:monospace}.pulse{animation:pulse 2.5s ease-in-out infinite}.dash{stroke-dasharray:9 13;animation:dash 9s linear infinite}.scan{animation:scan 6s linear infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-250}}@keyframes scan{0%{transform:translateY(-30px)}100%{transform:translateY(540px)}}</style>
</defs>
<rect width="1400" height="500" rx="20" fill="url(#b)"/><rect width="1400" height="500" rx="20" fill="url(#g)"/>
<text x="42" y="45" class="u" fill="#f9a8d4" font-size="18" font-weight="800" letter-spacing="2">ASC // VIBE CODING LAB</text><text x="1355" y="45" class="m" fill="#8fa8c3" text-anchor="end" font-size="12">PLAN / CODE / BUILD / TEST / DEPLOY</text>
<!-- Left source-code monitor -->
<g transform="translate(55 100)">
 <rect width="390" height="245" rx="14" fill="#07111e" stroke="#22d3ee" stroke-width="2" stroke-opacity=".8" filter="url(#gl)"/>
 <rect x="12" y="12" width="366" height="30" rx="6" fill="#101e32"/>
 <circle cx="28" cy="27" r="4" fill="#fb7185"/><circle cx="42" cy="27" r="4" fill="#fbbf24"/><circle cx="56" cy="27" r="4" fill="#34d399"/><text x="74" y="31" class="m" font-size="10" fill="#8fa8c3">src / product.ts</text>
 <g class="m" font-size="13"><text x="22" y="72" fill="#c084fc">const</text><text x="70" y="72" fill="#67e8f9"> buildFuture</text><text x="180" y="72" fill="#f8fafc"> = async () =&gt; {</text><text x="22" y="104" fill="#94a3b8">01</text><text x="52" y="104" fill="#f9a8d4">await</text><text x="100" y="104" fill="#86efac"> plan();</text><text x="22" y="136" fill="#94a3b8">02</text><text x="52" y="136" fill="#f9a8d4">await</text><text x="100" y="136" fill="#67e8f9"> architect();</text><text x="22" y="168" fill="#94a3b8">03</text><text x="52" y="168" fill="#f9a8d4">await</text><text x="100" y="168" fill="#86efac"> code.withPurpose();</text><text x="22" y="200" fill="#94a3b8">04</text><text x="52" y="200" fill="#f9a8d4">await</text><text x="100" y="200" fill="#67e8f9"> testAndShip();</text><text x="22" y="229" fill="#c084fc">};</text></g>
</g>
<!-- Right analytics monitor -->
<g transform="translate(955 100)">
