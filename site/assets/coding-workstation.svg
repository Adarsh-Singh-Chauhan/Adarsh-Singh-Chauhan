<g stroke="#67e8f9" stroke-opacity=".6" stroke-width="2"><path d="M540 461H860M530 470H870M550 454V480M580 454V480M610 454V480M640 454V480M670 454V480M700 454V480M730 454V480M760 454V480M790 454V480M820 454V480M850 454V480"/></g>
