name: Refresh Animated GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets-output
  cancel-in-progress: false

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh public repositories, daily commits, activity and game stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_sync.py

      - name: Generate animated contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Adarsh-Singh-Chauhan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage generated images inside the profile repository
        run: |
          mkdir -p assets/generated
          cp dist/daily-quest.svg assets/generated/daily-quest.svg
          cp dist/public-activity.svg assets/generated/public-activity.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/generated/github-contribution-grid-snake-dark.svg

      - name: Commit refreshed README and local profile images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh public GitHub profile data and generated images"
          file_pattern: README.md assets/generated/*.svg
          branch: main

      - name: Publish generated profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
