<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Adarsh Singh Chauhan — Software Development Engineer</title>
  <desc id="desc">Animated cyber engineering dashboard with terminal panels, neon circuit traces, system telemetry and a futuristic developer interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/><stop offset=".52" stop-color="#0a1530"/><stop offset="1" stop-color="#071f2b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6e8dab" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
      .muted{fill:#83a0bd}
      .cyan{fill:#67e8f9}
      .line{stroke:#22d3ee;stroke-opacity:.56;fill:none;stroke-width:2}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .scan{animation:scan 6s linear infinite}
      .flow{stroke-dasharray:10 13;animation:flow 12s linear infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(-70px)}100%{transform:translateY(500px)}}
      @keyframes flow{to{stroke-dashoffset:-230}}
    </style>
  </defs>
  <rect width="1600" height="430" rx="22" fill="url(#bg)"/>
  <rect width="1600" height="430" rx="22" fill="url(#grid)"/>
  <path d="M0 350H1600" stroke="#22d3ee" stroke-opacity=".15"/>
  <path d="M0 0H1600V430H0Z" fill="none" stroke="#294562" stroke-width="2"/>
  <g opacity=".7">
    <path class="line flow" d="M0 82H110L148 120H235M0 104H82L114 136H235M1365 62H1460L1495 96H1600M1390 84H1500L1530 114H1600"/>
    <path class="line" d="M55 350V306H128L156 278H210M1390 430V374H1460L1490 344H1600"/>
    <circle cx="235" cy="120" r="4" fill="#22d3ee" class="pulse"/>
    <circle cx="1365" cy="62" r="4" fill="#22d3ee" class="pulse"/>
  </g>
  <g transform="translate(46 54)">
    <rect width="310" height="292" rx="14" fill="#07101d" stroke="#28506b" stroke-width="1.5"/>
    <path d="M0 42H310" stroke="#28506b"/>
    <circle cx="22" cy="21" r="5" fill="#fb7185"/><circle cx="42" cy="21" r="5" fill="#fbbf24"/><circle cx="62" cy="21" r="5" fill="#34d399"/>
    <text x="88" y="26" class="mono muted" font-size="12">terminal / profile.sh</text>
    <text x="22" y="78" class="mono" fill="#67e8f9" font-size="14">$ whoami</text>
    <text x="22" y="104" class="mono" fill="#e2e8f0" font-size="15">adarsh@engineer-node</text>
    <text x="22" y="143" class="mono" fill="#67e8f9" font-size="14">$ current_focus</text>
    <text x="22" y="169" class="mono" fill="#cbd5e1" font-size="13">software_engineering</text>
    <text x="22" y="194" class="mono" fill="#cbd5e1" font-size="13">ai_ml · full_stack</text>
    <text x="22" y="219" class="mono" fill="#cbd5e1" font-size="13">cybersecurity · cloud</text>
    <text x="22" y="261" class="mono" fill="#4ade80" font-size="12">● SYSTEM ONLINE</text>
    <rect x="170" y="250" width="9" height="16" fill="#67e8f9" class="pulse"/>
  </g>
  <g transform="translate(405 112)">
    <text x="0" y="0" class="mono" fill="#67e8f9" font-size="16" letter-spacing="4">SOFTWARE ENGINEERING / BUILD MODE</text>
    <text x="-2" y="78" class="ui" fill="#f8fafc" font-size="55" font-weight="800" letter-spacing="1">ADARSH SINGH CHAUHAN</text>
    <rect x="0" y="101" width="560" height="3" rx="2" fill="url(#cyan)"/>
    <text x="0" y="145" class="ui" fill="#dbeafe" font-size="24" font-weight="700">SOFTWARE DEVELOPMENT ENGINEER</text>
    <text x="0" y="181" class="ui" fill="#9fb5d0" font-size="18">Full-Stack  /  AI &amp; ML  /  Cybersecurity  /  Cloud</text>
    <g transform="translate(0 218)" class="mono" font-size="12">
      <rect x="0" y="0" width="110" height="30" rx="7" fill="#0b3546" stroke="#22d3ee" stroke-opacity=".65"/>
      <text x="55" y="20" fill="#a5f3fc" text-anchor="middle">BUILD</text>
      <rect x="122" y="0" width="110" height="30" rx="7" fill="#17284b" stroke="#60a5fa" stroke-opacity=".7"/>
      <text x="177" y="20" fill="#bfdbfe" text-anchor="middle">TEST</text>
      <rect x="244" y="0" width="110" height="30" rx="7" fill="#2b1b49" stroke="#a78bfa" stroke-opacity=".7"/>
      <text x="299" y="20" fill="#ddd6fe" text-anchor="middle">DEPLOY</text>
      <path d="M112 15H120M234 15H242" stroke="#67e8f9" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(1190 58)">
    <rect width="355" height="292" rx="14" fill="#07101d" stroke="#28506b" stroke-width="1.5"/>
    <path d="M0 42H355" stroke="#28506b"/>
    <text x="20" y="27" class="mono muted" font-size="12">ENGINEERING / TELEMETRY</text>
    <g transform="translate(20 65)">
      <text x="0" y="0" class="mono" fill="#8ba7c2" font-size="11">SPECIALIZATION MATRIX</text>
      <g transform="translate(0 24)" font-size="12" class="mono" fill="#d4e6f7">
        <text y="0">FULL STACK</text><rect x="124" y="-10" width="170" height="8" rx="4" fill="#1c2d42"/><rect x="124" y="-10" width="146" height="8" rx="4" fill="#22d3ee"/>
        <text y="35">AI / ML</text><rect x="124" y="25" width="170" height="8" rx="4" fill="#1c2d42"/><rect x="124" y="25" width="126" height="8" rx="4" fill="#60a5fa"/>
        <text y="70">SECURITY</text><rect x="124" y="60" width="170" height="8" rx="4" fill="#1c2d42"/><rect x="124" y="60" width="115" height="8" rx="4" fill="#a78bfa"/>
        <text y="105">CLOUD</text><rect x="124" y="95" width="170" height="8" rx="4" fill="#1c2d42"/><rect x="124" y="95" width="105" height="8" rx="4" fill="#34d399"/>
      </g>
    </g>
    <g transform="translate(20 230)">
      <circle cx="15" cy="12" r="5" fill="#4ade80" class="pulse"/>
      <text x="30" y="16" class="mono" fill="#86efac" font-size="12">READY TO SHIP</text>
      <text x="294" y="16" class="mono muted" font-size="11" text-anchor="end">v1.0</text>
    </g>
  </g>
  <rect x="0" y="0" width="1600" height="70" fill="#22d3ee" opacity=".025" class="scan"/>
  <path d="M370 35H1130" stroke="url(#cyan)" stroke-width="1" opacity=".25"/>
</svg>