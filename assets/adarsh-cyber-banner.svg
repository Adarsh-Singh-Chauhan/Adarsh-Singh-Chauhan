<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">Adarsh Singh Chauhan — Software Development Engineer</title>
<desc id="desc">Neon cyberpunk gaming-inspired developer profile banner featuring Adarsh's actual GitHub avatar, engineering specializations, and a futuristic interface.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050711"/><stop offset=".48" stop-color="#10091e"/><stop offset="1" stop-color="#061a2c"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fb277b"/><stop offset=".55" stop-color="#ff5bb3"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#ec4899" stop-opacity=".34"/><stop offset=".62" stop-color="#7c3aed" stop-opacity=".14"/><stop offset="1" stop-color="#050711" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#6b8ba8" stroke-opacity=".12"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="portrait"><circle cx="1278" cy="270" r="174"/></clipPath>
  <style>
    .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .fade{animation:fade 3s ease-in-out infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
    .float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:10 12;animation:flow 12s linear infinite}
    .scan{animation:scan 5.5s linear infinite}
    @keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes pulse{0%,100%{opacity:.58;stroke-width:2}50%{opacity:1;stroke-width:5}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes flow{to{stroke-dashoffset:-260}}
    @keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(620px)}}
  </style>
</defs>
<rect width="1600" height="540" rx="24" fill="url(#bg)"/><rect width="1600" height="540" rx="24" fill="url(#grid)"/>
