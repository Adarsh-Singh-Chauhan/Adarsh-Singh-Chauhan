<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">Adarsh Singh Chauhan | Software Development Engineer</title>
<desc id="desc">Animated neon cyberpunk software engineering banner with large name typography, developer terminal, circuit paths and pink-cyan HUD accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050711"/><stop offset=".5" stop-color="#100b24"/><stop offset="1" stop-color="#071a2b"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff388f"/><stop offset=".55" stop-color="#ee69c7"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#628bff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8b2ca9" stop-opacity=".34"/><stop offset="1" stop-color="#081020" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7895b8" stroke-opacity=".12"/></pattern>
 <filter id="shine"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .u{font-family:Arial,Helvetica,sans-serif}.m{font-family:Consolas,monospace}
  .pulse{animation:pulse 2.7s ease-in-out infinite}.scan{animation:scan 6.5s linear infinite}
  .dash{stroke-dasharray:9 14;animation:dash 12s linear infinite}
  @keyframes pulse{0%,100%{opacity:.48}50%{opacity:1}}
  @keyframes scan{0%{transform:translateY(-30px)}100%{transform:translateY(600px)}}
  @keyframes dash{to{stroke-dashoffset:-280}}
 </style>
</defs>
<rect width="1500" height="560" rx="22" fill="url(#bg)"/><rect width="1500" height="560" rx="22" fill="url(#grid)"/>
<ellipse cx="1050" cy="270" rx="520" ry="310" fill="url(#glow)"/>
<path d="M0 74H1500M0 490H1500" stroke="#3c4964" stroke-opacity=".65"/>
<g class="m" font-size="13" letter-spacing="2" fill="#9fb4ce">
 <text x="44" y="46" fill="#ff76b9" font-weight="bold">ASC // DEVELOPER SYSTEM</text>
 <text x="910" y="46">OVERVIEW</text><text x="1030" y="46">PROJECTS</text><text x="1145" y="46">ENGINEERING</text><text x="1320" y="46">CONNECT</text>
</g>
<path d="M902 61H987" stroke="url(#pink)" stroke-width="3" filter="url(#shine)"/>
<g fill="none" stroke="#ff3b9d" stroke-opacity=".45" stroke-width="2">
 <path d="M0 142H92L142 92H260M0 170H63L116 116H198"/>
 <path d="M1250 108H1380L1422 150H1500M1294 137H1395L1445 187H1500"/>
</g>
<g class="m" fill="#67e8f9" font-size="12"><text x="74" y="137">BUILD / CODE / TEST / DEPLOY</text><text x="74" y="163">SOFTWARE ENGINEERING PROFILE 01</text></g>
<g class="u">
 <text x="68" y="278" fill="#f7f8ff" font-size="140" font-weight="900" letter-spacing="-7">ADARSH</text>
 <text x="75" y="369" fill="url(#pink)" font-size="82" font-weight="900" letter-spacing="-1">SINGH CHAUHAN</text>
 <rect x="76" y="393" width="730" height="3" rx="2" fill="url(#cyan)" filter="url(#shine)"/>
 <text x="76" y="438" fill="#ffffff" font-size="24" font-weight="bold" letter-spacing="1">SOFTWARE DEVELOPMENT ENGINEER  |  SOFTWARE ENGINEER</text>
 <text x="77" y="474" fill="#b6c3d9" font-size="18">FULL-STACK  /  AI &amp; ML  /  CYBERSECURITY  /  VIBE CODING</text>
</g>
<g transform="translate(1010 170)">
 <rect width="390" height="260" rx="16" fill="#080e1d" stroke="#22d3ee" stroke-opacity=".85" stroke-width="2" filter="url(#shine)"/>
 <rect x="15" y="15" width="360" height="32" rx="7" fill="#14203a"/>
 <circle cx="32" cy="31" r="5" fill="#fb7185"/><circle cx="50" cy="31" r="5" fill="#fbbf24"/><circle cx="68" cy="31" r="5" fill="#4ade80"/>
 <text x="92" y="35" class="m" font-size="12" fill="#90a7c4">adarsh@dev-console:~</text>
 <g class="m" font-size="18">
  <text x="28" y="90" fill="#22d3ee">&gt; build();</text>
  <text x="28" y="130" fill="#22d3ee">&gt; test();</text>
  <text x="28" y="170" fill="#22d3ee">&gt; deploy();</text>
  <text x="28" y="210" fill="#22d3ee">&gt; repeat();</text>
  <text x="250" y="210" fill="#4ade80" class="pulse">✓ SUCCESS</text>
 </g>
 <path d="M22 230H368" stroke="url(#pink)" stroke-width="2" class="dash"/>
</g>
<g class="m" font-size="12" fill="#91a7c2"><text x="76" y="46">PLAYER CLASS / SDE</text><text x="1418" y="508" text-anchor="end" fill="#f9a8d4">VIBE CODING MODE: ACTIVE</text></g>
<rect x="0" y="0" width="1500" height="560" rx="22" fill="none" stroke="#873b79" stroke-opacity=".75" stroke-width="2"/>
<rect width="1500" height="25" fill="#22d3ee" opacity=".035" class="scan"/>
</svg>