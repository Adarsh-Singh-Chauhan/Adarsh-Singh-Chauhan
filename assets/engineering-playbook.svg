<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Playbook — Design, Build, Verify, Ship</title>
  <desc id="desc">A dark neon software engineering workflow showing four stages: Design, Build, Verify and Ship.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset=".58" stop-color="#11142b"/>
      <stop offset="1" stop-color="#071b2a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff3b9d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff3b9d"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7187a5" stroke-opacity=".09"/>
    </pattern>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="188" rx="20" fill="url(#panel)" stroke="#344762" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="188" rx="20" fill="url(#grid)"/>
  <rect x="22" y="22" width="5" height="28" rx="2.5" fill="#22d3ee" filter="url(#glow)"/>
  <text x="42" y="33" fill="#a8bad3" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ASC // ENGINEERING PLAYBOOK</text>
  <text x="42" y="68" fill="#f7f8ff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing=".6">TURN IDEAS INTO RELIABLE SOFTWARE.</text>
  <text x="1158" y="36" text-anchor="end" fill="#47e6a3" font-family="Consolas,monospace" font-size="10" font-weight="700">BUILD / TEST / SHIP</text>
  <path d="M42 84H1158" stroke="url(#edge)" stroke-opacity=".7" stroke-width="1.5"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(42 103)">
      <rect width="250" height="61" rx="11" fill="#0d1c30" stroke="#22d3ee" stroke-opacity=".8"/>
      <circle cx="25" cy="30" r="13" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
      <text x="25" y="34" fill="#67e8f9" font-size="10" font-weight="800" text-anchor="middle">01</text>
      <text x="49" y="27" fill="#f7fbff" font-size="15" font-weight="800">DESIGN</text>
      <text x="49" y="44" fill="#91a6c4" font-size="10">Understand the problem</text>
    </g>
    <g transform="translate(331 103)">
      <rect width="250" height="61" rx="11" fill="#15152e" stroke="#a78bfa" stroke-opacity=".8"/>
      <circle cx="25" cy="30" r="13" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/>
      <text x="25" y="34" fill="#c4b5fd" font-size="10" font-weight="800" text-anchor="middle">02</text>
      <text x="49" y="27" fill="#f7fbff" font-size="15" font-weight="800">BUILD</text>
      <text x="49" y="44" fill="#a9a1c9" font-size="10">Engineer the solution</text>
    </g>
    <g transform="translate(620 103)">
      <rect width="250" height="61" rx="11" fill="#191629" stroke="#f472b6" stroke-opacity=".8"/>
      <circle cx="25" cy="30" r="13" fill="#f472b6" fill-opacity=".15" stroke="#f472b6"/>
      <text x="25" y="34" fill="#f9a8d4" font-size="10" font-weight="800" text-anchor="middle">03</text>
      <text x="49" y="27" fill="#f7fbff" font-size="15" font-weight="800">VERIFY</text>
      <text x="49" y="44" fill="#c4a1b9" font-size="10">Test, review, improve</text>
    </g>
    <g transform="translate(909 103)">
      <rect width="249" height="61" rx="11" fill="#0e1d27" stroke="#47e6a3" stroke-opacity=".8"/>
      <circle cx="25" cy="30" r="13" fill="#47e6a3" fill-opacity=".15" stroke="#47e6a3"/>
      <text x="25" y="34" fill="#86efac" font-size="10" font-weight="800" text-anchor="middle">04</text>
      <text x="49" y="27" fill="#f7fbff" font-size="15" font-weight="800">SHIP</text>
      <text x="49" y="44" fill="#95bea9" font-size="10">Deploy with confidence</text>
    </g>
  </g>
  <path d="M293 134H329M582 134H618M871 134H907" stroke="url(#bar)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="311" cy="134" r="3" fill="#67e8f9"/><circle cx="600" cy="134" r="3" fill="#c4b5fd"/><circle cx="889" cy="134" r="3" fill="#86efac"/>
  <text x="1158" y="179" text-anchor="end" fill="#647d9a" font-family="Consolas,monospace" font-size="8.5" letter-spacing=".7">SOFTWARE ENGINEERING · AI SYSTEMS · PRODUCT DELIVERY</text>
</svg>