  .scan{animation:scan 6s linear infinite}.dash{stroke-dasharray:9 12;animation:dash 12s linear infinite}
  @keyframes blink{to{visibility:hidden}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(550px)}}
  @keyframes dash{to{stroke-dashoffset:-250}}
 </style>
